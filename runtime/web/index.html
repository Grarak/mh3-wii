<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Hunter Tri (web)</title>
<style>
  :root { color-scheme: dark; --bg: #101214; --panel: #1b1f23; --text: #d8dde2; --muted: #8a949e; --accent: #c9a24a; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  #canvas { width: 100%; aspect-ratio: 960 / 544; background: #000; display: block; outline: none; }
  #setup { background: var(--panel); padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; }
  #setup[hidden] { display: none; }
  #status { color: var(--accent); margin: 8px 0; min-height: 1.4em; }
  #log { height: 180px; overflow: auto; background: var(--panel); color: var(--muted); font: 12px/1.3 ui-monospace, monospace; padding: 8px; margin-top: 12px; white-space: pre-wrap; }
  label { display: block; margin: 6px 0; }
  input[type=text] { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid #333; padding: 4px; }
  button { background: var(--accent); color: #111; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <section id="setup">
    <p>Monster Hunter Tri, recompiled, rendered through WebGPU. Supply your own European disc image
      (<code>RMHP08</code>, ISO, RVZ or WIA). It is copied once into this site's private browser storage
      and read from there; nothing is uploaded.</p>
    <label>Disc image <input id="disc" type="file" accept=".rvz,.wia,.iso"></label>
    <label>Arguments <input id="args" type="text" placeholder="for example --quest 19001 --area 1 --no-damage"></label>
    <button id="start" disabled>Start</button>
  </section>
  <div id="status"></div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="log"></div>
</main>
<script src="MH3.js"></script>
<script src="mh3-web.js"></script>
</body>
</html>
